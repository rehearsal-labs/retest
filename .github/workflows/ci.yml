name: CI
run-name: Gates on ${{ inputs.ref }}

# Every gate on Linux and on macOS. On Linux the gates run in the Docker harness with Chrome's sandbox on; on macOS
# integration uses the runner's Google Chrome, Retest's pinned Chromium, Firefox, WebKit and Electron builds, and
# media built from the checked commit. Nothing starts this workflow by itself: a person runs it by hand on a branch,
# a tag or a commit, and promote.yml calls it with the commit it is about to publish.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: The branch, tag or full commit SHA to check.
        required: true
        type: string
        default: main
  workflow_call:
    inputs:
      commit:
        description: The full commit SHA to check.
        required: true
        type: string

permissions:
  contents: read

jobs:
  # A branch can move while a macOS machine is still queued, so every job checks the one commit named here.
  commit:
    name: Resolve the commit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.resolve.outputs.commit }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.commit || inputs.ref }}
          persist-credentials: false
      - name: Resolve the commit
        id: resolve
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"
          {
            printf '### Gates on `%s`\n\n' "$(git rev-parse --short HEAD)"
            printf '%s\n\n' "$(git log -1 --format=%s HEAD)"
            printf 'Commit `%s`.\n' "$commit"
          } >> "$GITHUB_STEP_SUMMARY"

  linux:
    name: Linux ${{ matrix.arch }}
    needs: commit
    strategy:
      fail-fast: false
      matrix:
        # The harness was verified on arm64. Most CI machines people run Retest on are x64.
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.commit.outputs.commit }}
          persist-credentials: false
      # Builds docker/linux/Dockerfile (Node.js 24, Google Chrome and Debian's Chromium) and runs build, typecheck,
      # unit, types and integration in it: as a user other than root, with no capability, and with the seccomp
      # profile that lets Chrome's sandbox start.
      - name: Run every gate in the Linux harness
        run: sh docker/linux/run.sh

  macos:
    name: macOS arm64
    needs: commit
    # WebKit build 2359 requires macOS 26.5 or later. This is the standard public arm64 runner.
    runs-on: macos-26
    timeout-minutes: 120
    env:
      # The runner image ships Google Chrome here, which is also where the tests look by default.
      RETEST_TEST_BROWSER: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.commit.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          # The oldest Node.js package.json allows. The Linux image runs the newest Node.js 24.
          node-version: 24.12.0
      - name: Show macOS and Xcode
        run: |
          sw_vers
          uname -m
          xcodebuild -version
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Install recording tools
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          set -euo pipefail
          brew install ffmpeg
          rustup toolchain install 1.88.0 --profile minimal
          rust_tools="$(dirname "$(rustup which --toolchain 1.88.0 cargo)")"
          echo "$rust_tools" >> "$GITHUB_PATH"
          # GITHUB_PATH takes effect in later steps; use the exact binaries for these checks.
          "$rust_tools/rustc" --version
          "$rust_tools/cargo" --version
      # Keep the publisher archives for install.test.ts and seed the product installer's cache from the same checked
      # bytes. The second Chromium build is the pinned Chrome for Testing, so it needs no separate download.
      - name: Prepare pinned integration archives and paths
        run: node scripts/ci/prepare-macos-integration.ts "$RUNNER_TEMP/retest-integration"
      - name: Install pinned browsers and build media
        run: node dist/cli/main.js install chromium firefox webkit electron media
      - name: Verify integration prerequisites
        run: |
          set -euo pipefail
          node dist/cli/main.js install --list --verify
          "$RETEST_TEST_BROWSER" --version
          "$RETEST_TEST_SECOND_BROWSER" --version
          "$RETEST_TEST_FIREFOX" --version
          "$RETEST_TEST_ELECTRON" --version
          "$RETEST_TEST_MEDIA_BINARY" --version
          "$RETEST_TEST_FFMPEG" -version
          "$RETEST_TEST_FFPROBE" -version
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:types
      # TAP prints the error and its stack when a test fails; spec defers those details until the whole gate ends.
      - name: Run integration with failure details
        run: node --conditions=retest-source --test --test-concurrency=1 --test-reporter=tap "tests/integration/**/*.test.ts"
