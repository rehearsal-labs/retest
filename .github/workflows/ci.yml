name: CI
run-name: ${{ inputs.commit && 'Release gates' || inputs.suite || 'all' }} on ${{ inputs.commit || inputs.ref }}

# Manual debugging can choose a suite, platform and exact files. The fast suite runs build, types and unit files on
# the selected platforms and, when macOS is selected, its short integration files, to find what fails before the full
# matrix. Promotion calls
# this with only a commit, which always plans the full matrix. No push, tag or schedule starts this workflow.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: The branch, tag or full commit SHA to check.
        required: true
        type: string
        default: main
      suite:
        description: Full release coverage, a fast first look, or a focused check.
        type: choice
        options: [all, fast, checks, unit, integration]
        default: all
      platform:
        description: Platforms to check.
        type: choice
        options: [all, linux-x64, linux-arm64, macos-arm64]
        default: all
      files:
        description: Optional space-separated test paths. Requires the unit or integration suite.
        type: string
        default: ''
  workflow_call:
    inputs:
      commit:
        description: The full commit SHA to check with every gate.
        required: true
        type: string

permissions:
  contents: read

# New manual work replaces old work in the same suite/platform. Promotion has a run-specific group and is never cancelled here.
concurrency:
  group: ${{ inputs.commit && format('retest-ci-promotion-{0}', github.run_id) || format('retest-ci-manual-{0}-{1}-{2}', github.ref, inputs.suite || 'all', inputs.platform || 'all') }}
  cancel-in-progress: ${{ !inputs.commit }}

jobs:
  commit:
    name: Resolve the commit and assign every test file
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.resolve.outputs.commit }}
      full: ${{ steps.plan.outputs.full }}
      checks: ${{ steps.plan.outputs.checks }}
      unit: ${{ steps.plan.outputs.unit }}
      linux: ${{ steps.plan.outputs.linux }}
      macos: ${{ steps.plan.outputs.macos }}
      requested: ${{ steps.plan.outputs.requested }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.commit || inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24.12.0
      - name: Resolve the commit
        id: resolve
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"
          printf 'Commit `%s`.\n\n' "$commit" >> "$GITHUB_STEP_SUMMARY"
      - name: Assign every selected test file once per platform
        id: plan
        env:
          RETEST_CI_SCOPE: ${{ inputs.suite }}
          RETEST_CI_PLATFORM: ${{ inputs.platform }}
          RETEST_CI_TEST_FILES: ${{ inputs.files }}
        run: node scripts/ci/write-test-plan.ts

  checks:
    name: Build and types ${{ matrix.platform }}
    needs: commit
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.commit.outputs.checks) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.commit.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ matrix.platform == 'macos-arm64' && '24.12.0' || '24' }}
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run typecheck
      - run: npm run test:types

  unit:
    name: Unit ${{ matrix.platform }} ${{ matrix.shard }}/${{ matrix.total }}
    needs: commit
    if: ${{ needs.commit.outputs.unit != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.commit.outputs.unit) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.commit.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ matrix.platform == 'macos-arm64' && '24.12.0' || '24' }}
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Run assigned unit files one at a time
        env:
          RETEST_CI_FILES: ${{ toJSON(matrix.files) }}
        run: node scripts/ci/run-tests.ts "$RETEST_CI_FILES" "$RUNNER_TEMP/retest-ci-results"
      - name: Keep file results and timings
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: unit-${{ matrix.platform }}-${{ matrix.shard }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/retest-ci-results/results.json
          if-no-files-found: ignore
          retention-days: 7

  # Integration waits for build and types, not for the unit shards; the result job still refuses a failed unit shard.
  linux:
    name: Integration ${{ matrix.platform }} ${{ matrix.shard }}/${{ matrix.total }}
    needs: [commit, checks]
    if: ${{ needs.commit.outputs.linux != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.commit.outputs.linux) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.commit.outputs.commit }}
          persist-credentials: false
      - name: Run assigned integration files in the Linux harness
        env:
          RETEST_CI_FILES: ${{ toJSON(matrix.files) }}
          RETEST_LINUX_RESULTS: ${{ runner.temp }}/retest-ci-results
        run: sh docker/linux/run.sh sh -c 'npm run build && exec node scripts/ci/run-tests.ts "$1" /home/node/ci-results' retest-ci "$RETEST_CI_FILES"
      - name: Keep file results and timings
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: integration-${{ matrix.platform }}-${{ matrix.shard }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/retest-ci-results/results.json
          if-no-files-found: ignore
          retention-days: 7

  macos:
    name: Integration macOS ${{ matrix.lane }} ${{ matrix.shard }}/${{ matrix.total }}
    needs: [commit, checks]
    if: ${{ needs.commit.outputs.macos != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.commit.outputs.macos) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.lane == 'native' && 75 || 20 }}
    env:
      RETEST_TEST_BROWSER: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.commit.outputs.commit }}
          persist-credentials: false
      - uses: ./.github/actions/setup-macos-integration
      - name: Run assigned integration files one at a time
        id: integration
        env:
          RETEST_CI_FILES: ${{ toJSON(matrix.files) }}
          RETEST_CHROMIUM_TICKER_PROOF_OUT: ${{ runner.temp }}/retest-chromium-ticker-proof
        shell: bash
        run: |
          set -euo pipefail
          export RETEST_CI_CHROME_LIFECYCLE_LOG="$RUNNER_TEMP/retest-chrome-lifecycle.jsonl"
          export RETEST_CI_BROWSER_ACTION_PHASE_LOG="$RUNNER_TEMP/retest-browser-action-phases.jsonl"
          : > "$RETEST_CI_CHROME_LIFECYCLE_LOG"
          : > "$RETEST_CI_BROWSER_ACTION_PHASE_LOG"
          show_diagnostics() {
            integration_status=$?
            trap - EXIT
            cat "$RETEST_CI_CHROME_LIFECYCLE_LOG" "$RETEST_CI_BROWSER_ACTION_PHASE_LOG" || true
            exit "$integration_status"
          }
          trap show_diagnostics EXIT
          trap 'exit 143' TERM
          trap 'exit 130' INT
          export NODE_OPTIONS="${NODE_OPTIONS:+$NODE_OPTIONS }--import=$GITHUB_WORKSPACE/scripts/ci/chrome-lifecycle.ts --import=$GITHUB_WORKSPACE/scripts/ci/browser-action-phases.ts"
          node scripts/ci/run-tests.ts "$RETEST_CI_FILES" "$RUNNER_TEMP/retest-ci-results"
      - name: Keep file results and timings
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: integration-macos-${{ matrix.lane }}-${{ matrix.shard }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/retest-ci-results/results.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Keep synthetic ticker failure evidence
        if: ${{ failure() && steps.integration.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: chromium-ticker-${{ matrix.lane }}-${{ matrix.shard }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/retest-chromium-ticker-proof
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 0

  result:
    name: Verify every requested job finished
    needs: [commit, checks, unit, linux, macos]
    if: ${{ always() && needs.commit.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # The plan's job counts and each lane's result, never the file lists: those grow with every shard.
    env:
      RETEST_CI_REQUESTED: ${{ needs.commit.outputs.requested }}
      RETEST_CI_FULL: ${{ needs.commit.outputs.full }}
      RETEST_CI_CHECKS: ${{ needs.checks.result }}
      RETEST_CI_UNIT: ${{ needs.unit.result }}
      RETEST_CI_LINUX: ${{ needs.linux.result }}
      RETEST_CI_MACOS: ${{ needs.macos.result }}
    steps:
      - name: Refuse failed, cancelled or missing requested jobs
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs'
          const requested = JSON.parse(process.env.RETEST_CI_REQUESTED)
          const results = { checks: process.env.RETEST_CI_CHECKS, unit: process.env.RETEST_CI_UNIT, linux: process.env.RETEST_CI_LINUX, macos: process.env.RETEST_CI_MACOS }
          for (const [name, result] of Object.entries(results)) {
            const count = requested[name]
            if (!Number.isInteger(count) || count < 0) throw new Error(`${name}: the plan gave no job count`)
            const expected = count > 0 ? 'success' : 'skipped'
            if (result !== expected) throw new Error(`${name}: expected ${expected}, got ${result}`)
          }
          const full = process.env.RETEST_CI_FULL === 'true'
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, full ? 'Every job in the full release matrix succeeded.\n' : 'The requested focused checks succeeded. Full release coverage was not run.\n')
          JS
