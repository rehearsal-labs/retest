name: CI
run-name: Gates on ${{ inputs.ref }}

# Every gate on Linux and on macOS. On Linux the gates run in the Docker harness with Chrome's sandbox on; on macOS
# the integration tests run on the runner's Google Chrome and a pinned Chrome for Testing. Nothing starts this
# workflow by itself: a person runs it by hand on a branch, a tag or a commit, and promote.yml calls it with the
# commit it is about to publish.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: The branch, tag or full commit SHA to check.
        required: true
        type: string
        default: main
  workflow_call:
    inputs:
      commit:
        description: The full commit SHA to check.
        required: true
        type: string

permissions:
  contents: read

jobs:
  # A branch can move while a macOS machine is still queued, so every job checks the one commit named here.
  commit:
    name: Resolve the commit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.resolve.outputs.commit }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.commit || inputs.ref }}
          persist-credentials: false
      - name: Resolve the commit
        id: resolve
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"
          {
            printf '### Gates on `%s`\n\n' "$(git rev-parse --short HEAD)"
            printf '%s\n\n' "$(git log -1 --format=%s HEAD)"
            printf 'Commit `%s`.\n' "$commit"
          } >> "$GITHUB_STEP_SUMMARY"

  linux:
    name: Linux ${{ matrix.arch }}
    needs: commit
    strategy:
      fail-fast: false
      matrix:
        # The harness was verified on arm64. Most CI machines people run Retest on are x64.
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.commit.outputs.commit }}
          persist-credentials: false
      # Builds docker/linux/Dockerfile (Node.js 24, Google Chrome and Debian's Chromium) and runs build, typecheck,
      # unit, types and integration in it: as a user other than root, with no capability, and with the seccomp
      # profile that lets Chrome's sandbox start.
      - name: Run every gate in the Linux harness
        run: sh docker/linux/run.sh

  macos:
    name: macOS arm64
    needs: commit
    runs-on: macos-15
    timeout-minutes: 60
    env:
      # The runner image ships Google Chrome here, which is also where the tests look by default.
      RETEST_TEST_BROWSER: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.commit.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          # The oldest Node.js package.json allows. The Linux image runs the newest Node.js 24.
          node-version: 24.12.0
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:types
      # The second browser must be a different Chromium build. The script downloads one pinned Chrome for Testing
      # version from Google and refuses an archive whose SHA-256 differs from the one recorded.
      - name: Install Chrome for Testing
        run: |
          set -euo pipefail
          second="$(node scripts/ci/install-chrome-for-testing.ts "$RUNNER_TEMP/chrome-for-testing")"
          echo "RETEST_TEST_SECOND_BROWSER=${second}" >> "$GITHUB_ENV"
      - name: Show the two browsers
        run: |
          set -euo pipefail
          "$RETEST_TEST_BROWSER" --version
          "$RETEST_TEST_SECOND_BROWSER" --version
      - run: npm run test:integration
